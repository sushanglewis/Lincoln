schema_version: 3.0.0
id: lc-collect-intelligence
name: 信息收集
description: 基于权威报告、官方动态、开放 API 等渠道体系化收集研究证据并标注来源。
workflows:
- pm-research
prerequisite_stage: lc-analyze-frameworks
next_stage: lc-storytelling
human_gate: false
execution_mode: solo
primary_action: lc-collect-intelligence
variables:
- process_slug
- session_id
agent:
  primary: lc-researcher
  reviewers:
  - lc-pm
  handoff_to: null
skills:
  required:
  - lincoln:lc-collect-intelligence
  optional: []
artifacts:
  required:
  - '{process_slug}/research/{session_id}/collected-intelligence.md'
references:
  skill_prompt: .claude/skills/lc-collect-intelligence/SKILL.md
  agent_guide: .claude/agents/researcher.md
context:
  goal: 基于权威报告、官方动态、开放 API 等渠道体系化收集研究证据并标注来源。
  execution: "调用 lc-collect-intelligence skill 基于权威报告、官方动态、开放 API、官网等渠道体系化收集研究证据，标注来源并写入 collected-intelligence.md。"
  constraints: "- 本阶段产物写入 {process_slug}/research/{session_id}/。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - lc-analyze-frameworks
  exit:
  - check: artifacts_present
