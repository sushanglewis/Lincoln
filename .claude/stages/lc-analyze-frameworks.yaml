schema_version: 3.0.0
id: lc-analyze-frameworks
name: 分析框架应用
description: 选择并应用 SWOT、波特五力、商业模式画布、PEST 等分析框架，规划可视化方案。
workflows:
- pm-research
prerequisite_stage: lc-competitive-analysis
next_stage: lc-collect-intelligence
human_gate: false
execution_mode: solo
primary_action: lc-analyze-frameworks
variables:
- process_slug
- session_id
agent:
  primary: lc-researcher
  reviewers:
  - lc-pm
  handoff_to: null
skills:
  required:
  - lincoln:lc-analyze-frameworks
  optional: []
artifacts:
  required:
  - '{process_slug}/research/{session_id}/analysis-frameworks.md'
references:
  skill_prompt: .claude/skills/lc-analyze-frameworks/SKILL.md
  agent_guide: .claude/agents/researcher.md
context:
  goal: 选择并应用 SWOT、波特五力、商业模式画布、PEST 等分析框架，规划可视化方案。
  execution: "调用 lc-analyze-frameworks skill 基于已收集的研究材料选择并应用合适的分析框架（SWOT、波特五力、商业模式画布、PEST 等），输出 analysis-frameworks.md 并规划 ECharts/HTML 可视化方案。"
  constraints: "- 本阶段产物写入 {process_slug}/research/{session_id}/。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - lc-competitive-analysis
  exit:
  - check: artifacts_present
