schema_version: 3.0.0
id: workflow-router
name: Workflow Router
description: 'Entry point. Runs session intake (overview recon, situation judgment,

  Johari confirmation) on cold start, assesses repository context, selects the most

  appropriate workflow template, and initializes workflow-stage.'
workflows:
- bug-fix
- design-spike
- existing-project-iteration
- oss-first-design
- pm-research
prerequisite_stage: null
next_stage: null
human_gate: true
execution_mode: both
primary_action: lc-workflow-router
variables:
- process_slug
agent:
  primary: lc-pm
  reviewers:
  - lc-release-coordinator
  handoff_to: lc-pm
skills:
  required:
  - lincoln:lc-workflow-router
  - superpowers:bootstrap
  optional:
  - gsd:new-project
  - gsd:new-milestone
  - oh-my-claudecode:plan
artifacts:
  required:
  - '{process_slug}/workflow-stage.yaml'
references:
  skill_prompt: .claude/skills/lc-workflow-router/SKILL.md
  agent_guide: .claude/agents/pm.md
context:
  goal: 在会话启动时先做概览级摸排与处境判断（冷启动开场引导），经用户确认后选择最适合的 Lincoln 工作流模板。
  execution: 调用 lc-workflow-router skill 的 intake 流程：执行概览级摸排与处境判断，向人类 PM 提出 Johari 确认问题，经用户确认目标与执行路径后选择最匹配的工作流模板并初始化 {process_slug}/workflow-stage.yaml。
  constraints: '- 开场摸排为概览级：只读操作 ≤ 8 次，不读源码实现，不做深度扫描（禁用 lc-build-codebase-knowledge）。'
gates:
  entry: []
  exit:
  - check: artifacts_present
  - check: human_approved
