schema_version: 3.0.0
id: lc-stakeholder-research
name: 相关者研究
description: 识别并研究用户、买单方、建设方、维护方等关键相关者及其诉求。
workflows:
- pm-research
prerequisite_stage: lc-first-principles
next_stage: lc-market-research
human_gate: false
execution_mode: solo
primary_action: lc-stakeholder-research
variables:
- process_slug
- session_id
agent:
  primary: lc-researcher
  reviewers:
  - lc-pm
  handoff_to: null
skills:
  required:
  - lincoln:lc-stakeholder-research
  optional: []
artifacts:
  required:
  - '{process_slug}/research/{session_id}/stakeholders.md'
references:
  skill_prompt: .claude/skills/lc-stakeholder-research/SKILL.md
  agent_guide: .claude/agents/researcher.md
context:
  goal: 识别并研究用户、买单方、建设方、维护方等关键相关者及其诉求。
  execution: "调用 lc-stakeholder-research skill 识别并研究用户、买单方、建设方、维护方等关键相关者，找到他们的发声渠道并分析其诉求，输出 stakeholders.md。"
  constraints: "- 本阶段产物写入 {process_slug}/research/{session_id}/。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - lc-first-principles
  exit:
  - check: artifacts_present
