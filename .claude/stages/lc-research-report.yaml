schema_version: 3.0.0
id: lc-research-report
name: 研究报告
description: 整合全流程产物，输出可交付、可沉淀的最终研究报告。
workflows:
- pm-research
prerequisite_stage: lc-storytelling
next_stage: null
human_gate: true
execution_mode: solo
primary_action: lc-research-report
variables:
- process_slug
- session_id
agent:
  primary: lc-pm
  reviewers:
  - lc-researcher
  handoff_to: null
skills:
  required:
  - lincoln:lc-research-report
  optional: []
artifacts:
  required:
  - '{process_slug}/research/{session_id}/report.md'
references:
  skill_prompt: .claude/skills/lc-research-report/SKILL.md
  agent_guide: .claude/agents/pm.md
context:
  goal: 整合全流程产物，输出可交付、可沉淀的最终研究报告。
  execution: "调用 lc-research-report skill 整合研究全流程产物（scope/first-principles/stakeholders/market/product-research/competitive/analysis-frameworks/collected-intelligence/narrative），输出可交付、可沉淀的 report.md。"
  constraints: "- 本阶段产物写入 {process_slug}/research/{session_id}/。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - lc-storytelling
  exit:
  - check: artifacts_present
  - check: human_approved
