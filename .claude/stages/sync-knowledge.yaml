schema_version: 3.0.0
id: sync-knowledge
name: Sync Knowledge
description: 'After PR merge, updates Obsidian vault and archives milestone

  artifacts, generating feature docs, decision docs, and interview

  summaries.'
workflows:
- bug-fix
- design-spike
- existing-project-iteration
- interview-to-knowledge
- oss-first-design
prerequisite_stage: implement
next_stage: null
human_gate: false
execution_mode: both
primary_action: sync-to-knowledge
variables:
- pr_number
- session_id
- requirement_id
- feature_slug
- decision_id
agent:
  primary: lc-knowledge-curator
  reviewers:
  - lc-release-coordinator
skills:
  required:
  - lincoln:sync-to-knowledge
  - gsd:docs-update
  optional:
  - gsd:forensics
  - gsd:milestone-summary
  - openspec:sync-specs
  - oh-my-claudecode:wiki
  - oh-my-claudecode:writer-memory
  - superpowers:verification-before-completion
artifacts:
  required:
  - .github/lincoln-sync-queue/pr-{pr_number}.yaml
  - knowledge/01-interviews/{session_id}.md
  - knowledge/02-requirements/{requirement_id}.md
  - knowledge/03-features/{feature_slug}.md
  - knowledge/04-decisions/{decision_id}.md
references:
  skill_prompt: .claude/skills/sync-to-knowledge/SKILL.md
  agent_guide: .claude/agents/knowledge-curator.md
context:
  goal: PR 合并后，将代码变更、Issue 讨论、设计决策沉淀到项目 Obsidian 知识库，确保业务知识和技术知识双轨保存，形成可追溯的知识资产。
  execution: "调用 sync-to-knowledge skill 在 PR 合并后将代码变更、Issue 讨论与设计决策写入 Obsidian vault（knowledge/01-interviews、02-requirements、03-features、04-decisions），并在 .github/lincoln-sync-queue/pr-{pr_number}.yaml 记录同步状态。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - implement
  exit:
  - check: artifacts_present
