schema_version: 3.0.0
id: lc-market-research
name: 市场研究
description: 分析市场规模、趋势、细分与动态，为产品定位提供事实基础。
workflows:
- pm-research
prerequisite_stage: lc-stakeholder-research
next_stage: lc-product-research
human_gate: false
execution_mode: solo
primary_action: lc-market-research
variables:
- process_slug
- session_id
agent:
  primary: lc-researcher
  reviewers:
  - lc-pm
  handoff_to: null
skills:
  required:
  - lincoln:lc-market-research
  optional: []
artifacts:
  required:
  - '{process_slug}/research/{session_id}/market.md'
references:
  skill_prompt: .claude/skills/lc-market-research/SKILL.md
  agent_guide: .claude/agents/researcher.md
context:
  goal: 分析市场规模、趋势、细分与动态，为产品定位提供事实基础。
  execution: "调用 lc-market-research skill 分析市场规模、趋势、细分与动态，输出 market.md，为产品定位与机会判断提供事实基础。"
  constraints: "- 本阶段产物写入 {process_slug}/research/{session_id}/。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - lc-stakeholder-research
  exit:
  - check: artifacts_present
