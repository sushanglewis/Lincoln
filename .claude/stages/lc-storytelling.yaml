schema_version: 3.0.0
id: lc-storytelling
name: 体系化论述
description: 基于金字塔原理将研究成果结构化为可说服决策者的故事体系。
workflows:
- pm-research
prerequisite_stage: lc-collect-intelligence
next_stage: lc-research-report
human_gate: false
execution_mode: solo
primary_action: lc-storytelling
variables:
- process_slug
- session_id
agent:
  primary: lc-pm
  reviewers:
  - lc-researcher
  handoff_to: null
skills:
  required:
  - lincoln:lc-storytelling
  optional: []
artifacts:
  required:
  - '{process_slug}/research/{session_id}/narrative.md'
references:
  skill_prompt: .claude/skills/lc-storytelling/SKILL.md
  agent_guide: .claude/agents/pm.md
context:
  goal: 基于金字塔原理将研究成果结构化为可说服决策者的故事体系。
  execution: "调用 lc-storytelling skill 基于金字塔原理与科学论述逻辑，将研究成果结构化为可说服决策者的故事，输出 narrative.md。"
  constraints: "- 本阶段产物写入 {process_slug}/research/{session_id}/。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - lc-collect-intelligence
  exit:
  - check: artifacts_present
