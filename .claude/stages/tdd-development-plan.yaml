schema_version: 3.0.0
id: tdd-development-plan
name: TDD Development Plan
description: 'Produces tdd-plan.html with red/green/refactor sequences,

  test scenarios, and task slices ready for OpenSpec proposal.'
workflows:
- bug-fix
- existing-project-iteration
- interview-to-knowledge
- oss-first-design
prerequisite_stage: product-prototype
next_stage: propose
human_gate: false
execution_mode: both
primary_action: plan-tdd-development
variables:
- process_slug
artifact_templates:
  '{process_slug}/pages/docs/tdd-plan.html': .claude/templates/issue-package/page-doc.html.tpl
agent:
  primary: lc-engineer
  reviewers:
  - lc-qa
  - lc-architect
  handoff_to: lc-engineer
skills:
  required:
  - lincoln:plan-tdd-development
  - superpowers:writing-plans
  - superpowers:test-driven-development
  optional:
  - gsd:plan-phase
  - gsd:mvp-phase
  - oh-my-claudecode:plan
artifacts:
  required:
  - '{process_slug}/pages/docs/tdd-plan.html'
references:
  skill_prompt: .claude/skills/plan-tdd-development/SKILL.md
  agent_guide: .claude/agents/engineer.md
context:
  goal: 基于已确认的产品设计文档、字段规格、UI 规格和 Pencil 原型，生成可执行的测试驱动研发计划（`tdd-plan.html`），作为从产品设计到 OpenSpec 变更提案的桥梁。所有产物通过 {process_slug}/index.html 门户访问。
  execution: "调用 plan-tdd-development skill 基于已确认的产品设计文档、字段规格、UI 规格和 Pencil 原型，生成包含验收映射、测试场景与任务切片的 tdd-plan.html，作为 OpenSpec 提案的输入。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - product-prototype
  exit:
  - check: artifacts_present
