schema_version: 3.0.0
id: tdd-development-plan
name: TDD Development Plan
description: 'Produces tdd-plan.html with red/green/refactor sequences,

  test scenarios, and task slices ready for OpenSpec proposal.'
workflows:
- pm-team
- bug-fix
- existing-project-iteration
- interview-to-knowledge
- oss-first-design
prerequisite_stage: product-prototype
next_stage: propose
human_gate: false
execution_mode: both
primary_action: plan-tdd-development
variables:
- process_slug
artifact_templates:
  '{process_slug}/pages/docs/tdd-plan.html': .claude/templates/issue-package/page-doc.html.tpl
  '{process_slug}/pages/docs/prd-cross-validation.html': .claude/templates/issue-package/page-doc.html.tpl
agent:
  primary: lc-engineer
  reviewers:
  - lc-qa
  - lc-architect
  - lc-pm-validator
  handoff_to: lc-engineer
skills:
  required:
  - lincoln:plan-tdd-development
  - superpowers:writing-plans
  - superpowers:test-driven-development
  optional:
  - gsd:plan-phase
  - gsd:mvp-phase
  - oh-my-claudecode:plan
artifacts:
  required:
  - '{process_slug}/pages/docs/tdd-plan.html'
  - '{process_slug}/pages/docs/prd-cross-validation.html'
  optional:
  - '{process_slug}/pages/docs/prd-traceability.yaml'
  - '{process_slug}/pages/docs/prd-review.yaml'
references:
  skill_prompt: .claude/skills/plan-tdd-development/SKILL.md
  agent_guide: .claude/agents/engineer.md
context:
  goal: 基于已确认设计、字段规格、UI 规格和 HTML 原型生成 TDD 计划；core-v2 用 TEST 场景补齐追溯并反向挑战 PRD，缺口闭环后完成同版本四方重审、交叉验证和快照。Pencil 仅作可选源文件。
  execution: "调用 plan-tdd-development skill 生成验收映射、TEST 场景与任务切片；core-v2 同步维护 prd-traceability.yaml，并在任何 PRD 升版后重置和完成 prd-review.yaml。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - product-prototype
  exit:
  - check: artifacts_present
  - check: prd_traceability
    args:
    - tdd
  - check: prd_review_complete
    args:
    - '{process_slug}/pages/docs/prd-review.yaml'
  - check: prd_cross_validated
    args:
    - '{process_slug}/pages/docs/prd-cross-validation.html'
  - check: prd_snapshot_present
    args:
    - '{process_slug}/pages/docs/prd.html'
