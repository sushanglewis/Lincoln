schema_version: 3.0.0
id: lc-product-research
name: 产品研究
description: 研究相关产品与解决方案的能力、价值主张、使用场景与优劣势。
workflows:
- pm-research
prerequisite_stage: lc-market-research
next_stage: lc-competitive-analysis
human_gate: false
execution_mode: solo
primary_action: lc-product-research
variables:
- process_slug
- session_id
agent:
  primary: lc-researcher
  reviewers:
  - lc-pm
  handoff_to: null
skills:
  required:
  - lincoln:lc-product-research
  optional: []
artifacts:
  required:
  - '{process_slug}/research/{session_id}/product-research.md'
references:
  skill_prompt: .claude/skills/lc-product-research/SKILL.md
  agent_guide: .claude/agents/researcher.md
context:
  goal: 研究相关产品与解决方案的能力、价值主张、使用场景与优劣势。
  execution: "调用 lc-product-research skill 研究相关产品与解决方案的能力、价值主张、使用场景与优劣势，输出 product-research.md。"
  constraints: "- 本阶段产物写入 {process_slug}/research/{session_id}/。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - lc-market-research
  exit:
  - check: artifacts_present
