schema_version: 3.0.0
id: ingest
name: Ingest
description: 'Ingests raw interview recordings and produces transcripts,

  summaries, and raw insights.'
workflows:
- interview-to-knowledge
prerequisite_stage: workflow-router
next_stage: clarify
human_gate: false
execution_mode: team
primary_action: process-interview
variables:
- process_slug
- session_id
agent:
  primary: lc-pm
  handoff_to: lc-pm
skills:
  required:
  - lincoln:process-interview
  optional:
  - oh-my-claudecode:deep-interview
artifacts:
  required:
  - '{process_slug}/interviews/{session_id}/metadata.json'
  - '{process_slug}/interviews/{session_id}/transcript.md'
  - '{process_slug}/interviews/{session_id}/summary.md'
  - '{process_slug}/interviews/{session_id}/raw-insights.md'
references:
  skill_prompt: .claude/skills/process-interview/SKILL.md
  agent_guide: .claude/agents/pm.md
context:
  goal: 将音频访谈录音转写为结构化文本，生成带时间戳的逐字稿、摘要和初始洞察，为后续需求澄清阶段提供输入。
  execution: 调用 process-interview skill 处理 {process_slug}/recordings/ 下的原始音频，生成带时间戳的逐字稿、摘要与初始洞察，写入 {process_slug}/interviews/{session_id}/ 目录作为 clarify 阶段的输入。
gates:
  entry:
  - check: previous_stage_completed
    args:
    - workflow-router
  exit:
  - check: artifacts_present
