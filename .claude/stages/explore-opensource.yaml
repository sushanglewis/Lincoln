schema_version: 3.0.0
id: explore-opensource
name: Explore Open Source
description: 'Researches existing open-source projects that can inform

  or solve the current requirement. Triggered by oss-first-design

  template after clarify.'
workflows:
- oss-first-design
prerequisite_stage: clarify
next_stage: product-design-docs
human_gate: false
execution_mode: solo
primary_action: lc-explore-opensource
variables:
- process_slug
- change_name
agent:
  primary: lc-researcher
  reviewers:
  - lc-engineer
  handoff_to: lc-pm
skills:
  required:
  - lincoln:lc-explore-opensource
  optional: []
artifacts:
  required:
  - '{process_slug}/docs/research/{change_name}-oss-options.md'
references:
  skill_prompt: .claude/skills/lc-explore-opensource/SKILL.md
  agent_guide: .claude/agents/researcher.md
context:
  goal: 在设计阶段探索开源方案，避免从零造轮子，并为实现提供参考。
  execution: "调用 lc-explore-opensource skill 调研可复用的开源方案，评估其适配性、许可与维护状况，产出 {process_slug}/docs/research/{change_name}-oss-options.md，为产品设计与实现提供决策参考。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - clarify
  exit:
  - check: artifacts_present
