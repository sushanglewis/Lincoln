schema_version: 3.0.0
id: product-prototype
name: Product Prototype
description: 基于已确认设计文档生成字段规格、UI 规格和可交互 HTML 原型（pages/prototype/**/*.html）。Pencil 原型（prototype.pen）为可选，由 UI 在 UX 节点之后按需产出。
workflows:
- design-spike
- existing-project-iteration
- interview-to-knowledge
- oss-first-design
prerequisite_stage: product-design-docs
next_stage: tdd-development-plan
human_gate: true
execution_mode: both
primary_action: build-product-prototype
variables:
- process_slug
- design_id
artifact_templates:
  '{process_slug}/pages/docs/ui-spec.html': .claude/templates/issue-package/page-doc-structured.html.tpl
  '{process_slug}/pages/docs/fields.html': .claude/templates/issue-package/page-doc-structured.html.tpl
  '{process_slug}/pages/prototype/**/*.html': .claude/templates/issue-package/page-prototype-structured.html.tpl
agent:
  primary: lc-designer
  reviewers:
  - lc-pm
  - lc-frontend-engineer
  handoff_to: lc-engineer
skills:
  required:
  - lincoln:build-product-prototype
  - superpowers:brainstorming
  optional:
  - gsd:ui-phase
  - superpowers:using-git-worktrees
  - oh-my-claudecode:designer
artifacts:
  required:
  - '{process_slug}/pages/docs/ui-spec.html'
  - '{process_slug}/pages/docs/fields.html'
  - '{process_slug}/pages/prototype/**/*.html'
  optional:
  - '{process_slug}/designs/{design_id}/prototype.pen'
references:
  skill_prompt: .claude/skills/build-product-prototype/SKILL.md
  agent_guide: .claude/agents/designer.md
context:
  goal: 将已确认的产品设计文档转化为开发可用的 UI/字段规格 HTML 文档与高保真 HTML 交互原型。HTML 原型是本阶段的主要评审产物；`prototype.pen` 由 UI 在 UX 节点之后按需产出，在本阶段视为 optional。所有产物通过 {process_slug}/index.html 门户访问。
  execution: 调用 build-product-prototype skill 基于已确认的设计文档生成 fields.html、ui-spec.html 以及 pages/prototype/ 下的高保真 HTML 交互原型；Pencil 原型（prototype.pen）为 optional，仅在 PM 明确要求时由 UI 在 UX 节点之后产出。
  constraints: '- `{process_slug}/pages/prototype/**/*.html` 为 required 高保真 HTML 交互原型；`prototype.pen` 为 optional UI 阶段产物。'
gates:
  entry:
  - check: previous_stage_completed
    args:
    - product-design-docs
  exit:
  - check: artifacts_present
  - check: human_approved
