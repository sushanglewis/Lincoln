schema_version: 3.0.0
id: phase-1-p0-design
name: Phase 1 P0 Design
description: 'Design Phase 1 / P0 recommendations from the LEW-70 research baseline:

  SecurityAnalyzer + ConfirmationPolicy, harness distribution for

  Claude Code/Codex/OpenCode, and declarative hook/MCP configuration.

  '
prerequisite_stage: explore-opensource
next_stage: phase-1-p0-implement
human_gate: true
agent:
