  execution: "调用 lc-competitive-analysis skill 分析竞争格局、竞争对手定位、能力与差异化机会，输出 competitive.md。"
  constraints: "- 本阶段产物写入 {process_slug}/research/{session_id}/。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - lc-product-research
  exit:
  - check: artifacts_present
