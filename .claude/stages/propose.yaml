schema_version: 3.0.0
id: propose
name: Propose
description: 'Generates a complete OpenSpec change proposal including

  proposal.md, design.md, tasks.md, and specs/ directory.'
workflows:
- bug-fix
- existing-project-iteration
- interview-to-knowledge
- oss-first-design
prerequisite_stage: tdd-development-plan
next_stage: split
human_gate: false
execution_mode: both
primary_action: propose-with-openspec
variables:
- process_slug
- change_name
agent:
  primary: lc-engineer
  reviewers:
  - lc-qa
  - lc-architect
  handoff_to: lc-pm
skills:
  required:
  - lincoln:propose-with-openspec
  - openspec:propose
  optional:
  - superpowers:verification-before-completion
  - oh-my-claudecode:verify
artifacts:
  required:
  - '{process_slug}/openspec/changes/{change_name}/proposal.md'
  - '{process_slug}/openspec/changes/{change_name}/design.md'
  - '{process_slug}/openspec/changes/{change_name}/tasks.md'
  - '{process_slug}/openspec/changes/{change_name}/specs/'
references:
  skill_prompt: .claude/skills/propose-with-openspec/SKILL.md
  agent_guide: .claude/agents/engineer.md
context:
  goal: 基于已确认的 TDD 研发计划，调用 OpenSpec CLI 生成标准变更提案 artifact 目录（`{process_slug}/openspec/changes/{change_name}/`），将
    TDD 计划转化为结构化的 OpenSpec 变更提案，作为后续 GitHub Issues 拆分和研发实现的依据。
  execution: 调用 propose-with-openspec skill，通过 OpenSpec CLI 读取 tdd-plan.html 并生成标准变更提案目录，包含 proposal.md、design.md、tasks.md 与 specs/，作为后续 GitHub Issues 拆分与研发实现的依据。
gates:
  entry:
  - check: previous_stage_completed
    args:
    - tdd-development-plan
  exit:
  - check: artifacts_present
