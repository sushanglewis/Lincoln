schema_version: 3.0.0
id: clarify
name: Clarify
description: 'Explores requirements, resolves ambiguity, and produces

  confirmed requirements before design work begins.'
workflows:
- bug-fix
- design-spike
- existing-project-iteration
- interview-to-knowledge
- oss-first-design
prerequisite_stage: ingest
next_stage: product-design-docs
human_gate: true
execution_mode: both
primary_action: clarify-requirements
variables:
- process_slug
artifact_templates:
  '{process_slug}/pages/docs/requirements.html': .claude/templates/issue-package/page-doc.html.tpl
  '{process_slug}/pages/docs/stakeholders.html': .claude/templates/issue-package/page-doc.html.tpl
  '{process_slug}/pages/docs/user-stories.html': .claude/templates/issue-package/page-doc.html.tpl
  '{process_slug}/pages/docs/prd.html': .claude/templates/issue-package/page-doc.html.tpl
  '{process_slug}/pages/docs/snapshots/prd-v*.html': .claude/templates/issue-package/page-doc.html.tpl
agent:
  primary: lc-pm
  reviewers:
  - lc-qa
  handoff_to: lc-pm
skills:
  required:
  - lincoln:clarify-requirements
  - superpowers:brainstorming
  optional:
  - gsd:import
  - gsd:discuss-phase
  - oh-my-claudecode:deep-interview
artifacts:
  required:
  - '{process_slug}/pages/docs/requirements.html'
  - '{process_slug}/pages/docs/stakeholders.html'
  - '{process_slug}/pages/docs/user-stories.html'
  - '{process_slug}/pages/docs/prd.html'
  optional:
  - '{process_slug}/pages/docs/snapshots/prd-v*.html'
references:
  skill_prompt: .claude/skills/clarify-requirements/SKILL.md
  agent_guide: .claude/agents/pm.md
context:
  goal: 基于访谈产物（逐字稿、摘要、初始洞察）与人类 PM 进行多轮澄清，形成统一、可追溯、已确认的需求文档，并将 PRD 置于 HTML 门户（{process_slug}/pages/docs/prd.html）作为串联后续所有阶段的主线文档与单一事实来源。人类读者通过 {process_slug}/index.html 浏览所有产物。
  execution: "调用 clarify-requirements skill 与人类 PM 进行多轮澄清对话，基于访谈产物识别歧义并达成共识；产出 requirements、stakeholders、user-stories、prd 四个 HTML 文档，PRD 携带 <!-- version: vX.Y --> 版本标记，确认后通过 scripts/lincoln_prd.py freeze 生成不可变的快照。"
  constraints: "- PRD 必须位于 {process_slug}/pages/docs/prd.html，并携带 <!-- version: vX.Y --> 版本标记；确认后通过 scripts/lincoln_prd.py freeze 生成不可变的 pages/docs/snapshots/prd-vX.Y.html 快照。\n\n    - PRD 是产研流程的主线文档，需在后续阶段持续维护「相关产物链接」章节，指向设计、原型、OpenSpec、实现等产物。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - ingest
  exit:
  - check: artifacts_present
  - check: prd_has_required_sections
    args:
    - '{process_slug}/pages/docs/prd.html'
  - check: human_approved
  - check: prd_snapshot_present
    args:
    - '{process_slug}/pages/docs/prd.html'
