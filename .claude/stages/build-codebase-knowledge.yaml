schema_version: 3.0.0
id: build-codebase-knowledge
name: Build Codebase Knowledge
description: 'Scans existing source code and builds knowledge base

  for projects entering Lincoln with existing code but no

  feature knowledge base. Triggered by existing-project-iteration

  template after workflow-router.'
workflows:
- existing-project-iteration
prerequisite_stage: workflow-router
next_stage: clarify
human_gate: false
execution_mode: solo
primary_action: lc-build-codebase-knowledge
agent:
  primary: lc-knowledge-curator
  reviewers:
  - lc-engineer
  handoff_to: lc-pm
skills:
  required:
  - lincoln:lc-build-codebase-knowledge
  optional: []
artifacts:
  required:
  - knowledge/00-index.md
references:
  skill_prompt: .claude/skills/lc-build-codebase-knowledge/SKILL.md
  agent_guide: .claude/agents/knowledge-curator.md
context:
  goal: 为已有源码项目构建功能知识库，使后续 PM 迭代能基于事实。
  execution: "调用 lc-build-codebase-knowledge skill 扫描现有源码库，构建业务与技术知识索引，产出 knowledge/00-index.md 与 knowledge/03-features/ 下的功能知识文档，作为后续 PM 迭代的事实基础。"
gates:
  entry:
  - check: previous_stage_completed
    args:
    - workflow-router
  exit:
  - check: artifacts_present
