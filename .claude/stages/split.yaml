schema_version: 3.0.0
id: split
name: Split
description: 'Breaks OpenSpec tasks into parallel, independently implementable

  GitHub Issues with clear boundaries and acceptance criteria.'
workflows:
- bug-fix
- existing-project-iteration
- interview-to-knowledge
- oss-first-design
prerequisite_stage: propose
next_stage: implement
human_gate: false
execution_mode: both
primary_action: split-to-github
agent:
  primary: lc-pm
  reviewers:
  - lc-engineer
  - lc-qa
  handoff_to: lc-engineer
skills:
  required:
  - lincoln:split-to-github
  - superpowers:dispatching-parallel-agents
  optional:
  - gsd:phase
  - oh-my-claudecode:team
artifacts:
  required:
  - .github/linked-issues.yaml
references:
  skill_prompt: .claude/skills/split-to-github/SKILL.md
  agent_guide: .claude/agents/pm.md
context:
  goal: 将 OpenSpec 变更提案中的 tasks 拆分为可执行的 GitHub Issues，建立从需求到代码追踪的完整链路。
  execution: 调用 split-to-github skill 读取 OpenSpec 变更提案中的 tasks，拆分为边界清晰、可独立实施的 GitHub Issues，并写入 .github/linked-issues.yaml 维护任务与 issue 的双向映射。
gates:
  entry:
  - check: previous_stage_completed
    args:
    - propose
  exit:
  - check: artifacts_present
