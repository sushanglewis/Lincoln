name: Publish @sushanglewis/lincoln

"on":
  push:
    tags:
      - 'lincoln-v*'
  # Manual retry for tags pushed by CI: GITHUB_TOKEN tag pushes do not
  # trigger downstream workflows (GitHub recursion guard), so a tag created
  # by release-on-merge.yml needs this dispatch to actually publish.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. lincoln-v1.7.0'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: meta
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$REF_NAME" != lincoln-v* ]]; then
            echo "Expected a lincoln-v* tag, got: $REF_NAME" >&2
            exit 1
          fi
          TAG="${REF_NAME#lincoln-v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify package version matches tag
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./packages/lincoln/package.json').version")
          if [[ "$PKG_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Tag version $EXPECTED_VERSION does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w @sushanglewis/lincoln --if-present

      - name: Test
        run: npm test -w @sushanglewis/lincoln --if-present

      - name: Build
        run: npm run build -w @sushanglewis/lincoln --if-present

      - name: Publish to npm
        run: npm publish -w @sushanglewis/lincoln --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract release notes
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if ! python3 scripts/extract_release_notes.py "$VERSION" > release-notes.md; then
            echo "No curated release notes found for $VERSION; using fallback" >&2
            echo "lincoln-v${VERSION}" > release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          TAG="lincoln-v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; updating title and notes"
            gh release edit "$TAG" --title "Lincoln v${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Lincoln v${VERSION}" --notes-file release-notes.md
          fi
