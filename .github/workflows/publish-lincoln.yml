name: Publish @sushanglewis/lincoln

"on":
  push:
    tags:
      - 'lincoln-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME#lincoln-v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./packages/lincoln/package.json').version")
          if [[ "$PKG_VERSION" != "${{ steps.meta.outputs.version }}" ]]; then
            echo "Tag version ${{ steps.meta.outputs.version }} does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w @sushanglewis/lincoln --if-present

      - name: Test
        run: npm test -w @sushanglewis/lincoln --if-present

      - name: Build
        run: npm run build -w @sushanglewis/lincoln --if-present

      - name: Publish to npm
        run: npm publish -w @sushanglewis/lincoln --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
